name: refresh projects and stats
on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/update_profile.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          git config user.name "HisokaDrip"
          git config user.email "77979741+HisokaDrip@users.noreply.github.com"
          git add -A assets README.md
          git diff --cached --quiet || (git commit -m "refresh projects and stats" && git push)
